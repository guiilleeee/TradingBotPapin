# TradingBot v3 -- Alpaca: S&P 500 top-25 equities + 4 fixed crypto pairs

# Only the literal boolean `true` enables real-money trading. Anything else --
# "true", 1, yes, a typo -- resolves to simulation. Failing safe is the point.
live_execution: true

# claude | gemini
signal_provider: claude

db_path: trading_bot.db
csv_path: signals.csv
positions_path: positions.json
benchmark_path: benchmark.json

# Starting equity for simulation, and the fallback if live balances cannot be read.
fallback_equity_usd: 1000.0

# The dashboard's equity curve (live) starts at the first successfully read
# Alpaca balance at or above this -- the account's first real deposit. Set once.
funding_threshold_usd: 10.0

# Block new buys for the rest of the UTC day once today's realised loss reaches
# this percentage of equity. Sells stay allowed (the model can still cut a loser),
# and trading resumes by itself at 00:00 UTC. Live bracket stop-outs at the broker
# count too: each cycle books them from Alpaca's order history first.
circuit_breaker_loss_pct: 3.0

# Percent of equity to risk per trade. Position size is derived from this and the
# stop distance, then clamped by the absolute cap (per-symbol caps: see
# symbol_overrides below).
max_risk_pct: 3.0
max_absolute_position_pct: 25.0

# Minimum acceptable reward:risk (take-profit distance over stop-loss distance,
# both measured from current_price) -- a structural requirement, applied
# identically in live and simulation, not part of the confidence-threshold
# split above. A trade below this is overridden to hold by risk_manager.py.
min_reward_risk_ratio: 1.5

# A new buy's stop-loss must sit between these multiples of the 14-day ATR from
# price. Tighter is inside normal daily noise; wider sizes the position down to
# almost nothing. 0 disables a bound. Buy only; an unknown ATR skips the rule.
min_stop_atr_multiple: 1.0
max_stop_atr_multiple: 4.0

# Close a position held max_holding_days (calendar days) that is still within
# +/-min_move_pct of its entry -- it ties up cash and a portfolio slot. Checked
# by every cycle's sweep, bracketed live positions included (their bracket legs
# are cancelled first). Positions bought outside the bot are never touched.
time_exit:
  enabled: true
  max_holding_days: 10
  min_move_pct: 2.0

# No new buy when the next earnings report is this many calendar days away or
# fewer (0 = today). A bracket held through an earnings gap can lose far past its
# stop. 0 disables the rule; crypto and unknown dates are never blocked.
earnings_blackout_days: 2

# Confidence thresholds. These are read by separate code paths -- the live path
# cannot reach the simulation value (see mode.py).
min_confidence_live: 0.58
min_confidence_simulation: 0.40

# ---------------------------------------------------------------------- portfolio
# Limits on a new buy given what is already held (portfolio.py). Like the rules
# above, these can only shrink a buy or turn it into a hold -- never a sell.
#   max_open_positions      -- no new buy once this many positions are open.
#   max_gross_exposure_pct  -- total held value as % of equity; a buy is cut to
#                              the room left, or held if under min_position_pct.
#   groups                  -- at most max_positions held per group (by explicit
#                              symbol list, or by asset_class).
#   correlation             -- daily-return correlation over lookback_sessions,
#                              from the funnel's own download. At most
#                              max_correlated_positions (including the new one)
#                              may be correlated at >= threshold.
portfolio:
  max_open_positions: 6
  max_gross_exposure_pct: 80.0
  min_position_pct: 1.0
  groups:
    crypto:
      asset_class: crypto
      max_positions: 2
    semiconductors:
      symbols: [NVDA, AMD, AVGO, MU, QCOM, ASML, AMAT, LRCX, KLAC, MRVL, ADI, TXN, INTC, NXPI, MCHP, ON, ARM, GFS, MPWR, TER, SWKS]
      max_positions: 2
    megacap_platforms:
      symbols: [AAPL, MSFT, AMZN, GOOGL, GOOG, META]
      max_positions: 2
  correlation:
    enabled: true
    lookback_sessions: 60
    threshold: 0.75
    max_correlated_positions: 2
    min_overlap_sessions: 30

# ---------------------------------------------------------------- approval mode
# The bot trades fully autonomously: no order ever waits for a human. Manual
# approval was removed, so this must stay false -- a cycle refuses to run with
# `approval_mode: true` rather than trade while claiming to ask first.
approval_mode: false

# ------------------------------------------------------------------------- funnel
# Full-universe cycles (scheduled, or a manual run of trading_bot.yml) rank all
# 30 symbols locally -- no model call -- and send the model only the top_n
# candidates plus every symbol with an open position. Wake-up and single-symbol
# manual analyses bypass this. While NYSE is closed, only crypto can be a
# candidate (an equity buy would be skipped anyway). See funnel.py.
funnel:
  enabled: true
  top_n: 6
  # Pre-filter: the weekly screen keeps 25 of the ~425 non-financial S&P 500
  # names (symbols.yaml `pool`). At each scheduled cycle while NYSE is open, the
  # rest of the pool is checked in the same batched download, again with no model
  # call. A symbol is added for analysis (logged with trigger "prefilter") only if
  # daily volume_ratio >= volume_ratio AND move_z >= move_z AND the move is up.
  # At most max_extra are added per cycle, on top of top_n, and each symbol at
  # most once per UTC day. Cost ceiling: +max_extra model calls per market-hours cycle.
  prefilter:
    enabled: true
    volume_ratio: 2.0
    move_z: 2.0
    max_extra: 2

# ----------------------------------------------------------------------- universe
# Equities: the 25 largest non-financial S&P 500 companies by market cap. This
# list is the static fallback; weekly_screening.yml recomputes it every Monday
# into symbols.yaml, which replaces only the equity entries below.
# Crypto: fixed, never rotated by the screen (asset_class: crypto is what keeps
# them in place when symbols.yaml exists).
symbols:
  - {symbol: NVDA, asset_class: equity}
  - {symbol: AAPL, asset_class: equity}
  - {symbol: GOOGL, asset_class: equity}
  - {symbol: MSFT, asset_class: equity}
  - {symbol: AMZN, asset_class: equity}
  - {symbol: META, asset_class: equity}
  - {symbol: AVGO, asset_class: equity}
  - {symbol: TSLA, asset_class: equity}
  - {symbol: MU, asset_class: equity}
  - {symbol: LLY, asset_class: equity}
  - {symbol: AMD, asset_class: equity}
  - {symbol: WMT, asset_class: equity}
  - {symbol: XOM, asset_class: equity}
  - {symbol: JNJ, asset_class: equity}
  - {symbol: INTC, asset_class: equity}
  - {symbol: ABBV, asset_class: equity}
  - {symbol: CSCO, asset_class: equity}
  - {symbol: PLTR, asset_class: equity}
  - {symbol: ORCL, asset_class: equity}
  - {symbol: COST, asset_class: equity}
  - {symbol: AMAT, asset_class: equity}
  - {symbol: LRCX, asset_class: equity}
  - {symbol: CVX, asset_class: equity}
  - {symbol: CAT, asset_class: equity}
  - {symbol: KO, asset_class: equity}
  - {symbol: BTC-USD, asset_class: crypto}
  - {symbol: ETH-USD, asset_class: crypto}
  - {symbol: SOL-USD, asset_class: crypto}
  - {symbol: DOGE-USD, asset_class: crypto}

# ----------------------------------------------------------------- notifications
# Telegram is the channel that actually delivers: alerts send whenever
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set in the environment. Web push is
# NOT implemented (the dashboard is a static page with nowhere to store
# subscriptions); the bell icon is UI only.
notifications:
  web_push: false
  telegram: true

# ------------------------------------------------------------------- wake trigger
# Volume/price wake-up thresholds (volume_watch.py). Between scheduled cycles, a
# cheap watcher polls every 15 min and triggers a full analysis cycle for any
# symbol that crosses a threshold, subject to the cooldown. No LLM calls during
# the watch itself -- cost is purely the price/volume fetch.
# These are the defaults for every symbol; symbol_overrides can replace any of them.
wake_trigger:
  buy_side:
    price_move_pct_15m: 1.5
    volume_multiple: 2.0
  sell_side:
    price_drop_pct_15m: 1.5
    price_drop_pct_1h: 3.0
  min_seconds_between_wakes: 3600

# ---------------------------------------------------------------- symbol overrides
# Per-symbol exceptions (symbol_config.py). `wake_trigger` is merged key-by-key over
# the global block above -- anything not named here keeps the global value.
# `max_absolute_position_pct` can only tighten the global cap, never raise it.
# Only read from this file; symbols.yaml can never set these.
symbol_overrides:
  DOGE-USD:
    # Routine DOGE noise would trip the global 1.5% thresholds several times a day.
    wake_trigger:
      buy_side:
        price_move_pct_15m: 3.0
        volume_multiple: 3.0
      sell_side:
        price_drop_pct_15m: 3.0
        price_drop_pct_1h: 6.0
    max_absolute_position_pct: 10.0
