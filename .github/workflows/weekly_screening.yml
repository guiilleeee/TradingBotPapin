name: Weekly symbol screening

on:
  # SCHEDULE DISABLED: the VPS runs this job (deploy/systemd/, deploy/README.md).
  # GitHub Actions and the VPS must never both be scheduled -- two bots would trade
  # the same Alpaca account. workflow_dispatch stays for manual runs. To move back
  # to Actions, stop the VPS timers first, then uncomment the block below.
  # # Recomputes the top-25 Nasdaq-100 equities by market cap into symbols.yaml.
  # # The five crypto pairs are fixed in config.yaml and never touched here.
  # schedule:
    # - cron: '0 6 * * 1'  # Monday 06:00 UTC, before the week's first session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-symbol-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run weekly screening
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Optional: alerts are a no-op with NTFY_TOPIC unset (notifications.py).
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python screening.py --output symbols.yaml

      - name: Commit symbols.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols.yaml
          if git diff --staged --quiet; then
            echo "No change to symbols.yaml this run (screening left it untouched, or it is unchanged)."
          else
            git commit -m "chore: weekly symbol screening [skip ci]"
            git push
          fi
