name: TradingBot cycle

on:
  # SCHEDULE DISABLED: the VPS runs this job (deploy/systemd/, deploy/README.md).
  # GitHub Actions and the VPS must never both be scheduled -- two bots would trade
  # the same Alpaca account. workflow_dispatch stays for manual runs. To move back
  # to Actions, stop the VPS timers first, then uncomment the block below.
  # schedule:
    # # Cron is UTC; NYSE is 13:30-20:00 UTC under US daylight time (EDT, mid-March
    # # to early November) and 14:30-21:00 UTC under standard time (EST). Europe's
    # # DST switch is irrelevant here -- UTC doesn't move -- only the US one shifts
    # # the session, and both equity-hours slots below sit inside the session under
    # # either US regime, so no seasonal cron edit is ever needed:
    # #   14:45 UTC = 10:45 EDT / 09:45 EST  (16:45 CEST / 15:45 CET)
    # #   17:30 UTC = 13:30 EDT / 12:30 EST  (19:30 CEST / 18:30 CET) -- mid-session,
    # #               with 2.5h+ of headroom for GitHub's scheduled-run delays
    # #   02:00 UTC = overnight; NYSE closed, so the funnel only proposes crypto
    # - cron: '45 14 * * *'
    # - cron: '30 17 * * *'
    # - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run trading cycle
        # Every secret the bot actually reads must be listed here. An earlier
        # version left GEMINI_API_KEY out of this block (it existed only in a
        # separate test workflow) and every cycle failed on every symbol for days
        # without surfacing anywhere except the CSV.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required alongside the key: an identity-linked API key is rejected
          # without the anthropic-workspace-id header it supplies.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          # Telegram alerts (notifications.py); a no-op with these unset.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Web Push (web_push.py); a no-op with these unset.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION_KEY: ${{ secrets.PUSH_SUBSCRIPTION_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
        run: python main.py --config config.yaml

      - name: Publish dashboard
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp signals.csv docs/signals.csv
          cp config.yaml docs/config.yaml
          # positions.json export is non-fatal in main.py (see position_metrics.py),
          # so it may not exist yet on a very first run -- don't fail the publish step.
          [ -f positions.json ] && cp positions.json docs/positions.json || true
          [ -f benchmark.json ] && cp benchmark.json docs/benchmark.json || true

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html docs/signals.csv docs/config.yaml signals.csv trading_bot.db
          # positions.json export is non-fatal in main.py, so it may be absent.
          [ -f positions.json ] && git add -f positions.json docs/positions.json || true
          [ -f benchmark.json ] && git add -f benchmark.json docs/benchmark.json || true

          if git diff --staged --quiet; then
            echo "Nothing changed this cycle."
            exit 0
          fi

          git commit -m "chore: trading cycle results [skip ci]"

          # The concurrency group above only serializes this workflow's own runs
          # against each other -- it does nothing to protect against an unrelated
          # push (a manual web-UI edit, weekly_screening.yml, refresh_positions.yml,
          # ...) landing on main between this job's checkout and its own push.
          # Retry pull --rebase + push a bounded number of times rather than
          # failing outright the moment the remote has moved.
          max_attempts=3
          attempt=1
          while true; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after $max_attempts attempts -- giving up. This cycle's results are committed in this job's checkout but not published; the next scheduled run starts from a fresh checkout of main regardless, so no data is lost, but this cycle's export never reaches docs/. Check what is actually racing this workflow's pushes."
              exit 1
            fi

            echo "git push rejected (attempt $attempt/$max_attempts) -- the remote has moved. Rebasing onto it and retrying."
            if ! git pull --rebase; then
              echo "::error::git pull --rebase hit a real conflict, not just a fast-forward -- aborting the rebase cleanly rather than leaving the checkout half-rebased."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 5
          done
